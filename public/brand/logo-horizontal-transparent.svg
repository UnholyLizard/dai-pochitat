<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 48" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&amp;display=swap');
      .ct-brand-text {
        font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-weight: 700;
        font-size: 17px;
        letter-spacing: -0.05em;
        text-transform: uppercase;
      }
    </style>
    <g id="lighthouse-symbol">
      <path d="M13.7 7.3 3 4.7v5.2z" fill="#FFA41B" opacity="0.8" />
      <path d="M18.3 7.3 29 4.7v5.2z" fill="#FFA41B" opacity="0.8" />
      <path d="M13.3 5.6 16 2.8l2.7 2.8z" fill="currentColor" />
      <rect x="14.1" y="6" width="3.8" height="2.8" rx=".5" fill="#FFA41B" />
      <rect x="11.8" y="9.3" width="8.4" height="1.4" rx=".4" fill="currentColor" />
      <rect x="12.7" y="11.6" width="6.6" height="3.1" rx=".4" fill="currentColor" />
      <rect x="12.4" y="15.5" width="7.2" height="3.1" rx=".4" fill="currentColor" />
      <rect x="12.1" y="19.4" width="7.8" height="3.1" rx=".4" fill="currentColor" />
      <rect x="11.8" y="23.3" width="8.4" height="3.1" rx=".4" fill="currentColor" />
      <rect x="8.5" y="27.3" width="15" height="2" rx=".5" fill="currentColor" />
    </g>
  </defs>

  <!-- Transparent background -->
  <g color="#181A1D">
    <use href="#lighthouse-symbol" x="8" y="7" width="34" height="34" />
    <text x="40" y="32" fill="currentColor" class="ct-brand-text">CRAFT TOWER</text>
  </g>
</svg>
